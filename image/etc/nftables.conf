#!/usr/sbin/nft -f
# minivps-router-appliance 既定ruleset。
#
# 方針: デフォルト拒否 + 許可リスト。
# forward chain自体は established/related の通過とinvalid破棄のみを定義し、
# 新規セッションの許可ルールは /etc/nftables.d/90-segment-allow.conf 側に
# 運用者が追記する(本ファイルとは分離し、日常の許可/不許可の変更が
# ruleset全体の再読解なしで見渡せるようにするため)。
#
# 許可ルールはトップレベルinclude + `add rule inet filter forward ...` の形で
# 追記する(chainブロック内にincludeをネストする書き方ではない)。

flush ruleset

table inet filter {
    # 管理アクセス許可元。specs/router-1.yamlのdefault NIC(192.168.122.0/24)からのみ。
    define MGMT_NET = 192.168.122.0/24

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # 診断用: 全セグメント(=このVMの全NIC)からのpingを許可する。
        # このVM自身が複数セグメントの結節点なので、到達性確認の基本手段として必要。
        icmp type { echo-request, destination-unreachable, time-exceeded } accept

        # SSH管理アクセスはdefaultセグメントからのみ許可。
        ip saddr $MGMT_NET tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        # 個別の許可ルールはここには書かない。
        # /etc/nftables.d/*.conf (下記include) 側で
        # `add rule inet filter forward ...` として追記する。
    }

    chain output {
        # egressは制限しない(スコープ外。ルータ自身の発信通信(DNS/NTP/apt等)を
        # 妨げないシンプルさを優先する)。
        type filter hook output priority filter; policy accept;
    }
}

# 運用者が編集するforward chainの許可リスト。
# 一致するファイルが無くてもエラーにならない(nft(8) INCLUDE FILES参照)。
include "/etc/nftables.d/*.conf"
