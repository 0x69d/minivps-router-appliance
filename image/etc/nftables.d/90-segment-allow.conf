# minivps-router-appliance: forward chain 許可リスト(運用者編集用)。
# /etc/nftables.conf の末尾でincludeされる。
#
# 記法: 各行は完全な `add rule inet filter forward <マッチ条件...> accept` として書く。
# chain定義そのものは書かない。マッチはIPサブネット単位で書くこと。
#
# 双方向の疎通が必要な場合も、/etc/nftables.confのchain forwardにある
# `ct state established,related accept` が応答パケットを拾うので、
# 新規セッションの向き1本分のルールで足りる。
#
# 編集後は必ずメインファイル経由でreloadすること。
# このファイル単体を `nft -f` すると `add rule` が無条件追記され、
#  再読込のたびにルールが重複する。flush rulesetから再構築される
#  /etc/nftables.conf 経由でreloadすれば冪等。
#
#   sudo systemctl reload nftables
#
# --- 例(既定では全てコメントアウト。必要な疎通のみ有効化すること) ---
#
# 例1: seg1 -> seg2 を全許可する
# add rule inet filter forward ip saddr 192.168.201.0/24 ip daddr 192.168.202.0/24 accept
#
# 例2: seg1 -> seg2 のうち5432/tcp(PostgreSQL等)のみ許可する
# add rule inet filter forward ip saddr 192.168.201.0/24 ip daddr 192.168.202.0/24 tcp dport 5432 accept
#
# 例3: seg2 -> seg3 を全許可する
# add rule inet filter forward ip saddr 192.168.202.0/24 ip daddr 192.168.203.0/24 accept
#
# 既定では新規セッションを一切許可しない。

# --- 運用者ルール追記欄(ここから下に追記) ---
